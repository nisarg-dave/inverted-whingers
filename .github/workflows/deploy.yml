name: Deploy to S3 + CloudFront

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'master'
        type: choice
        options:
          - master

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2

jobs:
  approve:
    name: Approve Deployment
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deployment approved
        run: echo "✅ Deployment approved. Proceeding..."

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: approve
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/client
          retention-days: 1

  deploy-infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: build
    outputs:
      bucket-name: ${{ steps.get-outputs.outputs.bucket-name }}
      distribution-id: ${{ steps.get-outputs.outputs.distribution-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install CDK dependencies
        working-directory: infra
        run: npm ci

      - name: CDK Deploy (creates or updates stack)
        working-directory: infra
        run: npx cdk deploy --require-approval never --outputs-file cdk-outputs.json

      - name: Get stack outputs
        id: get-outputs
        working-directory: infra
        run: |
          BUCKET_NAME=$(jq -r '.InvertedWhingersStack.BucketName' cdk-outputs.json)
          DISTRIBUTION_ID=$(jq -r '.InvertedWhingersStack.DistributionId' cdk-outputs.json)
          echo "bucket-name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "distribution-id=$DISTRIBUTION_ID" >> $GITHUB_OUTPUT

  deploy-site:
    name: Deploy Site to S3
    runs-on: ubuntu-latest
    needs: deploy-infra
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync dist/ s3://${{ needs.deploy-infra.outputs.bucket-name }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.json"
          
          aws s3 sync dist/ s3://${{ needs.deploy-infra.outputs.bucket-name }}/ \
            --exclude "*" \
            --include "*.html" \
            --include "*.json" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.deploy-infra.outputs.distribution-id }} \
            --paths "/*"

      - name: Deployment summary
        run: |
          echo "🚀 Deployment complete!"
          echo "📦 Bucket: ${{ needs.deploy-infra.outputs.bucket-name }}"
          echo "🌐 Distribution: ${{ needs.deploy-infra.outputs.distribution-id }}"
